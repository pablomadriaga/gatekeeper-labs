apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: deploymentresourceswarning

spec:
  crd:
    spec:
      names:
        kind: DeploymentResourcesWarning

      validation:
        openAPIV3Schema:
          properties:

            warnCpu:
              type: string
              description: >
                Generate a warning when total Pod CPU requests
                exceed this value. Example: 200m.

            warnMemory:
              type: string
              description: >
                Generate a warning when total Pod memory requests
                exceed this value. Example: 350Mi.

  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package deploymentresourceswarning


        #
        # =========================================================
        # Containers from Deployment Pod template
        # =========================================================
        #

        containers :=
          input.review.object.spec.template.spec.containers


        #
        # =========================================================
        # Detect missing CPU requests
        # =========================================================
        #

        missing_cpu_request {
          container := containers[_]
          not container.resources
        }

        missing_cpu_request {
          container := containers[_]
          container.resources
          not container.resources.requests
        }

        missing_cpu_request {
          container := containers[_]
          container.resources.requests
          not container.resources.requests.cpu
        }


        #
        # =========================================================
        # Detect missing memory requests
        # =========================================================
        #

        missing_memory_request {
          container := containers[_]
          not container.resources
        }

        missing_memory_request {
          container := containers[_]
          container.resources
          not container.resources.requests
        }

        missing_memory_request {
          container := containers[_]
          container.resources.requests
          not container.resources.requests.memory
        }


        #
        # =========================================================
        # WARN: resources block missing
        # =========================================================
        #

        violation[{"msg": msg}] {
          container := containers[_]

          not container.resources

          msg := sprintf(
            "Deployment <%v>: container <%v> has no resources configured; CPU and memory requests are required",
            [
              input.review.object.metadata.name,
              container.name
            ]
          )
        }


        #
        # =========================================================
        # WARN: requests block missing
        # =========================================================
        #

        violation[{"msg": msg}] {
          container := containers[_]

          container.resources
          not container.resources.requests

          msg := sprintf(
            "Deployment <%v>: container <%v> has no resources.requests configured",
            [
              input.review.object.metadata.name,
              container.name
            ]
          )
        }


        #
        # =========================================================
        # WARN: CPU request missing
        # =========================================================
        #

        violation[{"msg": msg}] {
          container := containers[_]

          container.resources.requests
          not container.resources.requests.cpu

          msg := sprintf(
            "Deployment <%v>: container <%v> has no resources.requests.cpu configured",
            [
              input.review.object.metadata.name,
              container.name
            ]
          )
        }


        #
        # =========================================================
        # WARN: memory request missing
        # =========================================================
        #

        violation[{"msg": msg}] {
          container := containers[_]

          container.resources.requests
          not container.resources.requests.memory

          msg := sprintf(
            "Deployment <%v>: container <%v> has no resources.requests.memory configured",
            [
              input.review.object.metadata.name,
              container.name
            ]
          )
        }


        #
        # =========================================================
        # CPU normalization
        #
        # Result: millicores
        #
        # 100m -> 100
        # 0.5  -> 500
        # 1    -> 1000
        # =========================================================
        #

        cpu_millicores(value) = result {
          is_number(value)

          result :=
            value * 1000
        }

        cpu_millicores(value) = result {
          is_string(value)
          endswith(value, "m")

          result :=
            to_number(
              trim_suffix(value, "m")
            )
        }

        cpu_millicores(value) = result {
          is_string(value)
          not endswith(value, "m")

          regex.match(
            "^[0-9]+(\\.[0-9]+)?$",
            value
          )

          result :=
            to_number(value) * 1000
        }


        #
        # =========================================================
        # Memory normalization
        #
        # Result: MiB
        #
        # 350Mi -> 350
        # 1Gi   -> 1024
        # 512Ki -> 0.5
        # =========================================================
        #

        memory_mi(value) = result {
          is_string(value)
          endswith(value, "Mi")

          result :=
            to_number(
              trim_suffix(value, "Mi")
            )
        }

        memory_mi(value) = result {
          is_string(value)
          endswith(value, "Gi")

          n :=
            to_number(
              trim_suffix(value, "Gi")
            )

          result :=
            n * 1024
        }

        memory_mi(value) = result {
          is_string(value)
          endswith(value, "Ki")

          n :=
            to_number(
              trim_suffix(value, "Ki")
            )

          result :=
            n / 1024
        }


        #
        # =========================================================
        # Total Pod CPU request
        # =========================================================
        #

        pod_cpu = total {
          not missing_cpu_request

          values := [
            cpu |
            container := containers[_]

            value :=
              container.resources.requests.cpu

            cpu :=
              cpu_millicores(value)
          ]

          total := sum(values)
        }


        #
        # =========================================================
        # Total Pod memory request
        # =========================================================
        #

        pod_memory_mi = total {
          not missing_memory_request

          values := [
            memory |
            container := containers[_]

            value :=
              container.resources.requests.memory

            memory :=
              memory_mi(value)
          ]

          total := sum(values)
        }


        #
        # =========================================================
        # CPU WARNING
        # =========================================================
        #

        violation[{"msg": msg}] {
          total :=
            pod_cpu

          warning :=
            cpu_millicores(
              input.parameters.warnCpu
            )

          total > warning

          msg := sprintf(
            "Deployment <%v>: total Pod CPU request <%vm> exceeds the recommended value <%v>",
            [
              input.review.object.metadata.name,
              total,
              input.parameters.warnCpu
            ]
          )
        }


        #
        # =========================================================
        # MEMORY WARNING
        # =========================================================
        #

        violation[{"msg": msg}] {
          total :=
            pod_memory_mi

          warning :=
            memory_mi(
              input.parameters.warnMemory
            )

          total > warning

          msg := sprintf(
            "Deployment <%v>: total Pod memory request <%vMi> exceeds the recommended value <%v>",
            [
              input.review.object.metadata.name,
              total,
              input.parameters.warnMemory
            ]
          )
        }
