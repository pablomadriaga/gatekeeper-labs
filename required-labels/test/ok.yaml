apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-labels-ok
  labels:
    app: nginx
    owner: cloud-team
    environment: lab
    cost-center: cc-001
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
