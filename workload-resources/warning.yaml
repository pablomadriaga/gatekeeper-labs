apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: workloadresourceswarning

spec:
  crd:
    spec:
      names:
        kind: WorkloadResourcesWarning

      validation:
        openAPIV3Schema:
          properties:

            warnCpu:
              type: string
              description: >
                CPU request threshold from which a warning is generated.
                Example: 200m.

            warnMemory:
              type: string
              description: >
                Memory request threshold from which a warning is generated.
                Example: 350Mi.

            allowExemptions:
              type: boolean
              description: >
                Allow workloads to request an exemption from this policy.

            exceptionReasonAnnotation:
              type: string
              description: >
                Annotation key used to document the reason or ticket
                for an exemption.
                Example:
                policy.company.com/resource-policy-exception

  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package workloadresourceswarning


        #
        # =========================================================
        # Workload information
        # =========================================================
        #

        containers :=
          input.review.object.spec.template.spec.containers


        #
        # =========================================================
        # Exemption handling
        #
        # Fixed convention:
        #
        # metadata:
        #   labels:
        #     policy.company.com/resource-policy: exempt
        #
        # A valid exemption also requires the annotation configured
        # in exceptionReasonAnnotation.
        # =========================================================
        #

        exemption_requested {
          input.parameters.allowExemptions == true

          input.review.object.metadata.labels[
            "policy.company.com/resource-policy"
          ] == "exempt"
        }


        exception_reason_present {
          exemption_requested

          key :=
            input.parameters.exceptionReasonAnnotation

          key != ""

          reason :=
            input.review.object.metadata.annotations[key]

          reason != ""
        }


        valid_exemption {
          exemption_requested
          exception_reason_present
        }


        #
        # =========================================================
        # Detect missing CPU requests
        # =========================================================
        #

        missing_cpu_request {
          container := containers[_]
          not container.resources
        }

        missing_cpu_request {
          container := containers[_]
          container.resources
          not container.resources.requests
        }

        missing_cpu_request {
          container := containers[_]
          container.resources.requests
          not container.resources.requests.cpu
        }


        #
        # =========================================================
        # Detect missing memory requests
        # =========================================================
        #

        missing_memory_request {
          container := containers[_]
          not container.resources
        }

        missing_memory_request {
          container := containers[_]
          container.resources
          not container.resources.requests
        }

        missing_memory_request {
          container := containers[_]
          container.resources.requests
          not container.resources.requests.memory
        }


        #
        # =========================================================
        # WARN: resources block missing
        # =========================================================
        #

        violation[{"msg": msg}] {
          not valid_exemption

          container := containers[_]
          not container.resources

          kind := input.review.kind.kind

          msg := sprintf(
            "%v <%v>: container <%v> has no resources configured; CPU and memory requests are required",
            [
              kind,
              input.review.object.metadata.name,
              container.name
            ]
          )
        }


        #
        # =========================================================
        # WARN: requests block missing
        # =========================================================
        #

        violation[{"msg": msg}] {
          not valid_exemption

          container := containers[_]

          container.resources
          not container.resources.requests

          kind := input.review.kind.kind

          msg := sprintf(
            "%v <%v>: container <%v> has no resources.requests configured",
            [
              kind,
              input.review.object.metadata.name,
              container.name
            ]
          )
        }


        #
        # =========================================================
        # WARN: CPU request missing
        # =========================================================
        #

        violation[{"msg": msg}] {
          not valid_exemption

          container := containers[_]

          container.resources.requests
          not container.resources.requests.cpu

          kind := input.review.kind.kind

          msg := sprintf(
            "%v <%v>: container <%v> has no resources.requests.cpu configured",
            [
              kind,
              input.review.object.metadata.name,
              container.name
            ]
          )
        }


        #
        # =========================================================
        # WARN: memory request missing
        # =========================================================
        #

        violation[{"msg": msg}] {
          not valid_exemption

          container := containers[_]

          container.resources.requests
          not container.resources.requests.memory

          kind := input.review.kind.kind

          msg := sprintf(
            "%v <%v>: container <%v> has no resources.requests.memory configured",
            [
              kind,
              input.review.object.metadata.name,
              container.name
            ]
          )
        }


        #
        # =========================================================
        # CPU normalization
        #
        # Result: millicores
        # =========================================================
        #

        cpu_millicores(value) = result {
          is_number(value)
          result := value * 1000
        }

        cpu_millicores(value) = result {
          is_string(value)
          endswith(value, "m")

          result :=
            to_number(
              trim_suffix(value, "m")
            )
        }

        cpu_millicores(value) = result {
          is_string(value)
          not endswith(value, "m")

          regex.match(
            "^[0-9]+(\\.[0-9]+)?$",
            value
          )

          result :=
            to_number(value) * 1000
        }


        #
        # =========================================================
        # Memory normalization
        #
        # Result: MiB
        # =========================================================
        #

        memory_mi(value) = result {
          is_string(value)
          endswith(value, "Mi")

          result :=
            to_number(
              trim_suffix(value, "Mi")
            )
        }

        memory_mi(value) = result {
          is_string(value)
          endswith(value, "Gi")

          n :=
            to_number(
              trim_suffix(value, "Gi")
            )

          result :=
            n * 1024
        }

        memory_mi(value) = result {
          is_string(value)
          endswith(value, "Ki")

          n :=
            to_number(
              trim_suffix(value, "Ki")
            )

          result :=
            n / 1024
        }


        #
        # =========================================================
        # Total Pod CPU request
        # =========================================================
        #

        pod_cpu = total {
          not missing_cpu_request

          values := [
            cpu |
            container := containers[_]

            value :=
              container.resources.requests.cpu

            cpu :=
              cpu_millicores(value)
          ]

          total := sum(values)
        }


        #
        # =========================================================
        # Total Pod memory request
        # =========================================================
        #

        pod_memory_mi = total {
          not missing_memory_request

          values := [
            memory |
            container := containers[_]

            value :=
              container.resources.requests.memory

            memory :=
              memory_mi(value)
          ]

          total := sum(values)
        }


        #
        # =========================================================
        # CPU WARNING
        # =========================================================
        #

        violation[{"msg": msg}] {
          not valid_exemption

          total :=
            pod_cpu

          warning :=
            cpu_millicores(
              input.parameters.warnCpu
            )

          total > warning

          kind := input.review.kind.kind

          msg := sprintf(
            "%v <%v>: total Pod CPU request <%vm> exceeds the recommended value <%v>",
            [
              kind,
              input.review.object.metadata.name,
              total,
              input.parameters.warnCpu
            ]
          )
        }


        #
        # =========================================================
        # MEMORY WARNING
        # =========================================================
        #

        violation[{"msg": msg}] {
          not valid_exemption

          total :=
            pod_memory_mi

          warning :=
            memory_mi(
              input.parameters.warnMemory
            )

          total > warning

          kind := input.review.kind.kind

          msg := sprintf(
            "%v <%v>: total Pod memory request <%vMi> exceeds the recommended value <%v>",
            [
              kind,
              input.review.object.metadata.name,
              total,
              input.parameters.warnMemory
            ]
          )
        }
