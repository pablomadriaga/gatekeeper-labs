apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deny-cpu
  labels:
    app: nginx-deny-cpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-deny-cpu
  template:
    metadata:
      labels:
        app: nginx-deny-cpu
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests:
              cpu: 400m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
