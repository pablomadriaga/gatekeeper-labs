apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-annotation-only
  labels:
    app: nginx-annotation-only
  annotations:
    policy.company.com/resource-policy-exception: "INC-99999 - This should not exempt the workload"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-annotation-only
  template:
    metadata:
      labels:
        app: nginx-annotation-only
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
