apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deny-cpu
  labels:
    app: nginx-deny-cpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-deny-cpu
  template:
    metadata:
      labels:
        app: nginx-deny-cpu
    spec:
      containers:
        - name: nginx-deny-cpu
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
