apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-warning
  labels:
    app: nginx-warning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-warning
  template:
    metadata:
      labels:
        app: nginx-warning
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 250m
              memory: 400Mi
            limits:
              cpu: 500m
              memory: 768Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
