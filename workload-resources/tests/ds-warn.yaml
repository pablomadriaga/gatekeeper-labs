apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-ds-warning
  labels:
    app: nginx-ds-warning
spec:
  selector:
    matchLabels:
      app: nginx-ds-warning
  template:
    metadata:
      labels:
        app: nginx-ds-warning
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests:
              cpu: 250m
              memory: 400Mi
            limits:
              cpu: 500m
              memory: 768Mi
