apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sblockloadbalancer
  annotations:
    metadata.gatekeeper.sh/title: "Block Services with type LoadBalancer"
    metadata.gatekeeper.sh/version: 1.0.0
    description: >-
      Disallows all Services with type LoadBalancer.
spec:
  crd:
    spec:
      names:
        kind: K8sBlockLoadBalancer

  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblockloadbalancer

        violation[{"msg": msg}] {
          input.review.kind.kind == "Service"
          input.review.object.spec.type == "LoadBalancer"

          msg := sprintf(
            "Service <%v>: no esta permitido crear Services de tipo LoadBalancer por politicas de la organizacion. Contacto: servidores-cloud@prismamp.com",
            [input.review.object.metadata.name]
          )
        }
